<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="gnBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#7f1d1d" />
    </linearGradient>
    <radialGradient id="gnGlow" cx="70%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#gnBg)" />
  <rect width="1280" height="720" fill="url(#gnGlow)" />
  <!-- World grid graphics -->
  <circle cx="900" cy="360" r="300" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="3" />
  <circle cx="900" cy="360" r="200" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="2" stroke-dasharray="12 8" />
  <ellipse cx="900" cy="360" rx="300" ry="100" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2" />
  <ellipse cx="900" cy="360" rx="100" ry="300" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2" />
  <!-- Live tag & branding -->
  <rect x="80" y="80" width="100" height="36" rx="6" fill="#ef4444" />
  <text x="130" y="104" font-family="system-ui, sans-serif" font-weight="900" font-size="18" fill="#ffffff" text-anchor="middle" letter-spacing="2">LIVE</text>
  <text x="80" y="240" font-family="system-ui, sans-serif" font-weight="900" font-size="64" fill="#ffffff" letter-spacing="-1">GLOBAL NEWS 24</text>
  <text x="80" y="290" font-family="system-ui, sans-serif" font-weight="500" font-size="24" fill="rgba(255,255,255,0.7)">24-Hour International Live Broadcast & Breaking News</text>
  <!-- Lower third overlay simulation -->
  <rect x="0" y="600" width="1280" height="120" fill="rgba(15,23,42,0.85)" />
  <rect x="0" y="600" width="240" height="120" fill="#dc2626" />
  <text x="120" y="670" font-family="system-ui, sans-serif" font-weight="800" font-size="28" fill="#ffffff" text-anchor="middle">BREAKING</text>
  <text x="280" y="668" font-family="system-ui, sans-serif" font-weight="600" font-size="22" fill="#ffffff">Global Economic Summit Concludes with Historic Agreement in Geneva</text>
</svg>
